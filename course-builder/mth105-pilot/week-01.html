function sampleTool(el){
  el.innerHTML=`<div class="tool"><div class="sl"><label for="sm-n">Sample size n</label><input type="range" id="sm-n" min="5" max="200" step="5" value="10"><b class="mono" id="sm-nv"></b></div><div class="pic"></div><div class="feedback"></div><p class="mono" style="margin:0;color:var(--muted)">Population: 1,000 students, 60% prefer evening classes (illustrative). 20 random samples.</p></div>`;
  const run=()=>{ const n=+el.querySelector('#sm-n').value; el.querySelector('#sm-nv').textContent=n; let seed=11; const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
    const ps=[...Array(20)].map(()=>{ let k=0; for(let i=0;i<n;i++) if(rnd()<.6) k++; return k/n; });
    const Wd=520,Hd=120,L=20,R=20,X=p=>L+(Wd-L-R)*p;
    el.querySelector('.pic').innerHTML=`<svg viewBox="0 0 ${Wd} ${Hd}" role="img" aria-label="Sample percentages"><line x1="${L}" x2="${Wd-R}" y1="80" y2="80" stroke="var(--ink)"/>${[0,.2,.4,.6,.8,1].map(p=>`<line x1="${X(p)}" x2="${X(p)}" y1="80" y2="86" stroke="var(--muted)"/><text x="${X(p)}" y="100" text-anchor="middle" ${MONO} font-size="11" fill="var(--muted)">${p*100}%</text>`).join('')}
      <line x1="${X(.6)}" x2="${X(.6)}" y1="10" y2="80" stroke="var(--wk)" stroke-width="2" stroke-dasharray="5 4"/><text x="${X(.6)+6}" y="20" ${FT} font-size="12" font-weight="700" fill="var(--wk)">true 60%</text>
      ${ps.map((p,i)=>`<circle cx="${X(p)}" cy="${70-(i%6)*9}" r="5" fill="var(--c2)" opacity=".75"/>`).join('')}</svg>`;
    const lo=Math.min(...ps), hi=Math.max(...ps);
    el.querySelector('.feedback').innerHTML=`Samples gave between <b>${Math.round(lo*100)}%</b> and <b>${Math.round(hi*100)}%</b>. ${n<40?'Small samples swing a lot.':'Larger samples land closer to 60%.'}`; };
  el.querySelector('input').addEventListener('input',run); run();
}
function outlierTool(el){
  const base=[14,16,15,17,15];
  el.innerHTML=`<div class="tool"><div class="seg2"><button type="button" aria-pressed="false">Without 90</button><button type="button" aria-pressed="true">With 90</button></div><div class="pic"></div><div class="out"></div></div>`;
  const draw=on=>{ const a=on?[...base,90]:base, m=a.reduce((p,q)=>p+q,0)/a.length, md=ST.median(a), X=v=>20+480*(v-10)/85;
    el.querySelector('.pic').innerHTML=`<svg viewBox="0 0 520 110" role="img" aria-label="Delivery times dot plot"><line x1="20" x2="500" y1="70" y2="70" stroke="var(--ink)"/>${[10,30,50,70,90].map(t=>`<text x="${X(t)}" y="92" text-anchor="middle" ${MONO} font-size="11" fill="var(--muted)">${t}</text>`).join('')}
      ${a.map((v,i)=>`<circle cx="${X(v)}" cy="${60-(a.slice(0,i).filter(w=>w===v).length)*12}" r="6" fill="${v===90?'var(--wk)':'var(--c2)'}"/>`).join('')}
      <line x1="${X(m)}" x2="${X(m)}" y1="10" y2="70" stroke="var(--wk)" stroke-width="2"/><text x="${X(m)+5}" y="16" ${FT} font-size="12" font-weight="700" fill="var(--wk)">mean</text>
      <line x1="${X(md)}" x2="${X(md)}" y1="30" y2="70" stroke="var(--c3)" stroke-width="2" stroke-dasharray="5 4"/><text x="${X(md)+5}" y="44" text-anchor="start" ${FT} font-size="12" font-weight="700" fill="var(--c3)">median</text></svg>`;
    el.querySelector('.out').innerHTML=`<div><small>Mean</small><b>${ST.r2(m)} min</b></div><div><small>Median</small><b>${ST.r2(md)} min</b></div>`; };
  el.querySelectorAll('.seg2 button').forEach((b,i)=>b.addEventListener('click',()=>{ el.querySelectorAll('.seg2 button').forEach(x=>x.setAttribute('aria-pressed',x===b)); draw(i===1); }));
  draw(true);
}

    def:'A <b>representative</b> sample looks like the population. Choose it <b>at random</b>, not by convenience. Larger random samples give estimates closer to the truth.',
    defFig:{label:'Random, not convenient', html:G1.samples},
    life:{text:'A newsletter asks 30 students in the library at 9 PM; 21 say they prefer studying at night. Headline: “70% of students prefer night study.” The sample is biased: students in the library at night already study at night.'},
    meaning:{text:'Drag the sample size. With small n, sample results swing widely; with large n, they cluster near the true value.', fig:{label:'Drag the sample size', build:sampleTool}} },

  { id:'outliers', title:'The impact of outliers',
    def:'An <b>outlier</b> is a value far from the rest of the data.',
    defFig:{label:'Far from the rest', html:G1.outl},
    life:{text:'Pizza delivery times (min): 12, 14, 13, 15, 46. One late delivery (46) is far from the others.'},
    formula:{f:`${T('xb',XB)} = ${fr(`${T('S',SG)}${T('x',v('x'))}`,T('n',v('n')))}`,
      parts:[['xb','<b>x̄</b>: the mean.'],['S','<b>Σ</b>: add up.'],['x','<b>x</b>: each value.'],['n','<b>n</b>: how many values.']],
      sub:`x̄ = ${fr('12 + 14 + 13 + 15 + 46','5')}`, keys:'( 1 2 + 1 4 + 1 3 + 1 5 + 4 6 ) ÷ 5 =',
      ans:`<div class="m">x̄ = <b>20</b> min</div>`, ansRaw:true, ansNote:'The median is 14 min. Four of five deliveries took 15 min or less.'},
    meaning:{text:'The outlier pulls the mean up to 20; the median stays at 14. With outliers, report the median.', fig:{label:'Add or remove the outlier', build:outlierTool}} }
  ],
  inClass:{intro:'Two exercises we solve together. Work on paper first; the writing box is for practice at home.', items:[
    {q:'A researcher wants to know the average daily screen time of CUD students. Name (a) the population, (b) a good sample, (c) the variable and its type, (d) one possible source of bias.', tips:['Population = everyone the question is about.','A good sample is chosen at random from the whole population.','Screen time is measured: decide discrete or continuous.','Bias: who might be left out, or answer differently?']},
    {q:'Daily water intake (litres) of 7 students: 1.5, 2.0, 1.8, 2.2, 1.6, 2.1, 6.0. Find the mean and the median. Which describes a typical student better, and why?', tips:['Add all seven values, divide by 7.','Sort the values before finding the middle.','Look for a value far from the others.']}]},
  takeaways:{label:'Week 1 on one page', mindmap:{center:'Week 1', branches:[
    {t:'Statistics',items:['Collect, organize, analyze, interpret, communicate','Descriptive vs inferential']},
    {t:'Population and sample',items:['N → parameters μ, σ, p','n → statistics x̄, s, p̂']},
    {t:'Types of data',items:['Nominal, ordinal','Discrete, continuous']},
    {t:'Good samples',items:['Random, representative','Larger n → closer estimates']},
    {t:'Outliers',items:['Pull the mean','Median resists them']}]}},
  practice:[
    {check:[{l:'Sample',opts:['All adults in Dubai','The 400 surveyed','28%'],v:'The 400 surveyed'},{l:'28% is a',opts:['Statistic','Parameter'],v:'Statistic'}],revise:'The <b>population</b> is the whole group the question is about; the <b>sample</b> is the part measured. A value from the sample (28%) is a <b>statistic</b>, not a parameter.',see:{t:'Revise: Population and sample',href:'#population'},type:'Easy',q:'A health survey asks 400 adults in Dubai and finds 28% exercise daily. Name the population, sample, parameter and statistic.',hint:'Population: all adults in Dubai. Sample: the 400 surveyed. Statistic: <b>28%</b>. Parameter: the true % of <b>all</b> Dubai adults who exercise daily (unknown).'},
    {check:[{l:'(a)',opts:['Nominal','Ordinal','Discrete','Continuous'],v:'Nominal'},{l:'(b)',opts:['Nominal','Ordinal','Discrete','Continuous'],v:'Discrete'},{l:'(c)',opts:['Nominal','Ordinal','Discrete','Continuous'],v:'Continuous'},{l:'(d)',opts:['Nominal','Ordinal','Discrete','Continuous'],v:'Ordinal'}],revise:'Ask first: category or number? Categories are nominal (no order) or ordinal (ordered); numbers are discrete (counted) or continuous (measured).',see:{t:'Revise: Types of data',href:'#types'},type:'Easy',q:'Classify: (a) blood type (b) number of emails received today (c) height in cm (d) class rank (1st, 2nd, 3rd).',hint:BA.steps([['(a)','<b>Nominal</b>: categories with no order. Not ordinal (no ranking), not a number.'],['(b)','<b>Discrete</b>: counted 0, 1, 2 … Not continuous (no 2.5 emails), not a category.'],['(c)','<b>Continuous</b>: measured, any value (165.3 cm). Not discrete: it is not counted.'],['(d)','<b>Ordinal</b>: categories with an order. Not nominal (order matters), not a measured number.']])},
    {check:[{l:'p̂',v:34,u:'%',pct:true}],revise:'p̂ = x ÷ n, then × 100 for a percentage. Divide the count with the feature by the sample size, not the other way round.',see:{t:'Revise: Population and sample',href:'#population'},type:'Easy',q:'In a sample of 250 residents, 85 use the Metro. Find p̂ as a percentage.',hint:BA.board([{lines:[BB.fr('p̂','x','n',{n:'85 use the Metro',d:'250 residents'}),BB.line(`p̂ = ${BB.frac('85','250')} = 0.34 = <b>34%</b>`,'ans')],calc:KC('85÷250')}])},
    {check:[{l:'Type',opts:['Descriptive','Inferential'],v:'Inferential'}],revise:'If the statement goes beyond the data collected to a whole population, it is <b>inferential</b>.',see:{t:'Revise: Descriptive and inferential statistics',href:'#descriptive'},type:'Medium',q:'Descriptive or inferential? “From 1,200 shoppers surveyed, we estimate 35% of UAE shoppers buy groceries online.”',hint:BA.steps([['Why','It uses 1,200 shoppers to estimate a value for <b>all</b> UAE shoppers.'],['Not descriptive','Descriptive would only summarise the 1,200 surveyed.'],['Answer','<b>Inferential</b>.']])},
    {check:[{l:'Problem',opts:['Biased sample','Sample too small','No problem'],v:'Biased sample'},{l:'Fix',opts:['Random sample of all students','Ask more gym users','Ask only one class'],v:'Random sample of all students'}],revise:'A sample must be chosen <b>at random</b> from the whole population. Asking only people who already have the feature gives a biased sample.',see:{t:'Revise: Representative samples and sample size',href:'#samples'},type:'Medium',q:'To estimate gym use at CUD, a researcher asks students as they leave the gym. What is wrong, and how would you fix it?',hint:'Every person asked already uses the gym: the sample is <b>biased</b>. Take a <b>random</b> sample of all students.'},
    {check:[{l:'Mean',v:34.8333,u:'min',tol:0.006},{l:'Median',v:23.5,u:'min'},{l:'Better',opts:['Mean','Median'],v:'Median'}],revise:'x̄ = Σx ÷ n. Sort the data before finding the median; with n even, take the mean of the two middle values.',see:{t:'Revise: The impact of outliers',href:'#outliers'},type:'Hard',q:'Commute times (min): 20, 22, 25, 24, 23, 95. Find the mean and the median. Which is the better typical value?',hint:BA.board([BA.mean([20,22,25,24,23,95],{t:'Mean',unit:'min'})])+BA.steps([['Median','Sorted: 20, 22, <b>23, 24</b>, 25, 95 → (23 + 24) ÷ 2 = <b>23.5</b> min'],['Answer','The <b>median</b>: the outlier 95 pulls the mean up.']])},
    {check:[{l:'New mean',v:22.8,u:'min'},{l:'New median',v:23,u:'min'},{l:'Changed more',opts:['Mean','Median'],v:'Mean'}],revise:'Recalculate with n = 5 after removing 95, and sort again for the median. An outlier moves the mean much more than the median.',see:{t:'Revise: The impact of outliers',href:'#outliers'},type:'Hard',q:'Remove 95 from the commute data. Find the new mean and median. Which measure changed more?',hint:BA.board([BA.mean([20,22,25,24,23],{t:'New mean',unit:'min'})])+BA.steps([['New median','Sorted: 20, 22, <b>23</b>, 24, 25 → <b>23</b> min'],['Answer','The <b>mean</b> changed more (34.83 → 22.8). The median only moved from 23.5 to 23.']])}],
  next:'Next: Week 2, Ch.2 Picturing Variation with Graphs. <a href="week-02.html">Open Week 2 →</a>'
