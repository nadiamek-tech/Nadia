/* board model answers for practice: BA / Board from assets/board-answers.js and assets/board.js */
const Bd=Board, MA=(...p)=>{ const li=p.map(x=>!!x.b).lastIndexOf(true); return p.map((x,i)=>x.b?(i===li?BA.board(x.b):Bd.make(x.b)):BA.steps(x.s)).join(''); };
const nCr=(n,k)=>{ let r=1; for(let i=1;i<=k;i++) r=r*(n-k+i)/i; return Math.round(r); }, f4=x=>x.toFixed(4), ok4=x=>Math.abs(x*1e4-Math.round(x*1e4))<1e-9;
const BIN=`P(X = x) = <span class="g">n</span>C<span class="g">x</span> · <span class="r">p</span><sup>x</sup> · <span class="r">q</span><sup>n − x</sup>`;
function gBin(n,x,p,o={}){ const q=+(1-p).toFixed(4), c=nCr(n,x), a=p**x, b=q**(n-x), P=c*a*b;
  return {t:o.t||`P(X = ${x})`,lines:[Bd.line(BIN),Bd.dec([['n',n],['x',x],['p',p],['q = 1 − p',q]]),
    Bd.line(`P(X = ${x}) = ${n}C${x} × (${p})<sup>${x}</sup> × (${q})<sup>${n-x}</sup>`),
    Bd.line(`P(X = ${x}) = ${c} × ${BA.r4(a)} × ${BA.r4(b)} ${ok4(P)?'=':'≈'} <b>${f4(P)}</b>`,'ans')],calc:[`${n}C${x}×(${p})^${x}×(${q})^${n-x}`,BA.lcd(P)]}; }
function gMu(n,p){ return {t:'μ',lines:[Bd.line('μ = <span class="g">n</span><span class="r">p</span>'),Bd.dec([['n',n],['p',p]]),Bd.line(`μ = ${n} × ${p} = <b>${BA.num(n*p)}</b>`,'ans')],calc:[`${n}×${p}`,BA.lcd(n*p)]}; }
function gVarB(n,p){ const q=+(1-p).toFixed(4); return {t:'Var(X)',lines:[Bd.line('Var(X) = <span class="g">n</span><span class="r">p</span><span class="g">q</span>'),Bd.dec([['n',n],['p',p],['q = 1 − p',q]]),Bd.line(`Var(X) = ${n} × ${p} × ${q} = <b>${BA.num(n*p*q)}</b>`,'ans')],calc:[`${n}×${p}×${q}`,BA.lcd(n*p*q)]}; }
function gSDB(n,p){ const q=+(1-p).toFixed(4), v=n*p*q, sd=Math.sqrt(v); return {t:'SD',lines:[Bd.line('SD = √(<span class="g">n</span><span class="r">p</span><span class="g">q</span>)'),Bd.line(`SD = √(${n} × ${p} × ${q}) = √${BA.num(v)} ≈ <b>${BA.r2(sd)}</b>`,'ans')],calc:[`√(${n}×${p}×${q})`,BA.lcd(sd)]}; }
function gNone(n,q,o={}){ const v=q**n; return {t:o.t||'P(X = 0)',lines:[Bd.line('P(X = 0) = <span class="r">q</span><sup class="g">n</sup>'),Bd.dec([['n',n],['q',q]]),Bd.line(`P(X = 0) = (${q})<sup>${n}</sup> ≈ <b>${f4(v)}</b>`,'ans')],calc:[`(${q})^${n}`,BA.lcd(v)]}; }
const bern=`<svg viewBox="0 0 520 170" role="img" aria-label="Bernoulli distribution, p = 0.75"><line x1="80" x2="440" y1="140" y2="140" stroke="var(--ink)"/>
  <rect x="140" y="${140-0.25*130}" width="80" height="${0.25*130}" fill="var(--c2)" opacity=".6"/><rect x="300" y="${140-0.75*130}" width="80" height="${0.75*130}" fill="var(--wk)"/>
  <text x="180" y="160" text-anchor="middle" ${MONO} font-size="12" fill="var(--ink)">x = 0 · miss</text><text x="340" y="160" text-anchor="middle" ${MONO} font-size="12" fill="var(--ink)">x = 1 · goal</text>
  <text x="180" y="${130-0.25*130}" text-anchor="middle" ${MONO} font-size="12" fill="var(--ink)">q = 0.25</text><text x="340" y="${130-0.75*130}" text-anchor="middle" ${MONO} font-size="12" fill="var(--ink)">p = 0.75</text></svg>`;
/* binomial bar chart: n, p, highlighted x values, optional mean line and ±SD band */
function binomBars(n,p,o={}){
  const P=[...Array(n+1)].map((_,x)=>ST.choose(n,x)*p**x*(1-p)**(n-x)), xs=o.max!=null?o.max:n, mx=Math.max(...P.slice(0,xs+1));
  const Wd=520,Hd=200,L=14,B=30,T0=22,bw=(Wd-2*L)/(xs+1), X=x=>L+x*bw+bw/2, Y=v=>Hd-B-(Hd-B-T0)*v/mx;
  let s=`<svg viewBox="0 0 ${Wd} ${Hd}" role="img" aria-label="Binomial distribution, n = ${n}, p = ${p}">`;
  if(o.mu!=null){ const a=X(o.mu-o.sd), b=X(o.mu+o.sd); s+=`<rect x="${a}" y="${T0-8}" width="${b-a}" height="${Hd-B-T0+8}" fill="var(--wk-soft)"/>`; }
  for(let x=0;x<=xs;x++){ const on=(o.hl||[]).includes(x), h=Hd-B-Y(P[x]);
    s+=`<rect x="${X(x)-bw*.36}" y="${Y(P[x])}" width="${bw*.72}" height="${h}" fill="${on?'var(--wk)':'var(--c2)'}" opacity="${on?1:.5}"/><text x="${X(x)}" y="${Hd-B+16}" text-anchor="middle" ${MONO} font-size="${xs>10?10:12}" fill="var(--ink)">${x}</text>`;
    if(o.labels) s+=`<text x="${X(x)}" y="${Y(P[x])-6}" text-anchor="middle" ${MONO} font-size="11" fill="var(--ink)">${P[x].toFixed(4)}</text>`; }
  if(o.mu!=null) s+=`<line x1="${X(o.mu)}" x2="${X(o.mu)}" y1="${T0-8}" y2="${Hd-B}" stroke="var(--ink)" stroke-dasharray="5 4"/><text x="${X(o.mu)+6}" y="${T0+4}" ${MONO} font-size="12" fill="var(--ink)">μ = ${o.mu}</text>`;
  s+=`<line x1="${L}" x2="${Wd-L}" y1="${Hd-B}" y2="${Hd-B}" stroke="var(--ink)"/><text x="${Wd/2}" y="${Hd-2}" text-anchor="middle" ${FT} font-size="11" fill="var(--muted)">${esc(o.xlabel||'x = number of successes')}</text></svg>`;
  return s;
}
