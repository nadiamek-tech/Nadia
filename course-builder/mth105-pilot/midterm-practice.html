<script>
const {W} = Lecture; Lecture.__noLogo=true; const esc = W.esc;
const {T, fr, sq, SG, XB, PH, v} = F;
const goScene = i => { const b=document.querySelectorAll('.toc ol li button')[i]; if(b) b.click(); };
const practice = (items, label) => el => W.practice(el, items, {label: label||'Show answer', prefix: ''});
const FT='font-family="Schibsted Grotesk,Arial"', MONO='font-family="JetBrains Mono,monospace"';
const HOW='Method: as covered in class and in last Wednesday’s lab revision.';
/* Mind the Gap model answer: rule → formula → decode → substitute → calculator → answer */
const MG=o=>`<div class="mg">${o.r?`<div><span>Which rule</span><span>${o.r}</span></div>`:''}${o.f?`<div><span>Formula</span><span>${o.f}</span></div>`:''}${o.d?`<div><span>Decode</span><span>${o.d}</span></div>`:''}${o.s?`<div><span>Substitute</span><span>${o.s}</span></div>`:''}${o.k?`<div><span>Calculator</span>${F.keys(o.k)}</div>`:''}<div class="fin"><span>Answer</span><span>${o.a}</span></div>${o.how===false?'':`<div class="how"><span>${HOW}</span></div>`}</div>`;
const steps=a=>`<div class="mg">${a.map(([l,t])=>`<div${l==='Answer'?' class="fin"':''}><span>${l}</span><span>${t}</span></div>`).join('')}<div class="how"><span>${HOW}</span></div></div>`;
const tbl=(h,rows)=>`<table class="tbl" style="margin:6px 0"><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table>`;
function bars(vals,labels,xl){ const Wd=440,Hd=170,bw=(Wd-60)/vals.length; return `<svg viewBox="0 0 ${Wd} ${Hd}" role="img" aria-label="Bar chart">${[0,2,4,6,8].map(g=>`<line x1="34" x2="${Wd-10}" y1="${140-g*14}" y2="${140-g*14}" stroke="var(--line)"/><text x="28" y="${144-g*14}" text-anchor="end" ${MONO} font-size="10" fill="var(--muted)">${g}</text>`).join('')}${vals.map((v,i)=>`<rect x="${44+i*bw+bw*.2}" y="${140-v*14}" width="${bw*.6}" height="${v*14}" fill="var(--wk)" opacity=".75"/><text x="${44+i*bw+bw/2}" y="156" text-anchor="middle" ${MONO} font-size="11" fill="var(--ink)">${labels[i]}</text>`).join('')}<line x1="34" x2="${Wd-10}" y1="140" y2="140" stroke="var(--ink)"/><text x="${Wd/2}" y="${Hd-1}" text-anchor="middle" ${FT} font-size="11" fill="var(--muted)">${xl}</text></svg>`; }
function ogive(b,c,xl){ const Wd=440,Hd=190,L=34,R=12,T=10,B=34,n=c[c.length-1],X=i=>L+(Wd-L-R)*i/(b.length-1),Y=v=>T+(Hd-T-B)*(1-v/n); return `<svg viewBox="0 0 ${Wd} ${Hd}" role="img" aria-label="Ogive">${[0,10,20,30,40].map(g=>`<line x1="${L}" x2="${Wd-R}" y1="${Y(g)}" y2="${Y(g)}" stroke="var(--line)"/><text x="${L-5}" y="${Y(g)+4}" text-anchor="end" ${MONO} font-size="10" fill="var(--muted)">${g}</text>`).join('')}<polyline points="${c.map((v,i)=>`${X(i)},${Y(v)}`).join(' ')}" fill="none" stroke="var(--c3)" stroke-width="2.4"/>${c.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="4" fill="var(--c3)"/><text x="${X(i)}" y="${Y(v)-8}" text-anchor="middle" ${MONO} font-size="10" fill="var(--ink)">${v}</text><text x="${X(i)}" y="${Hd-B+16}" text-anchor="middle" ${MONO} font-size="10" fill="var(--muted)">${b[i]}</text>`).join('')}<text x="${(L+Wd-R)/2}" y="${Hd-3}" text-anchor="middle" ${FT} font-size="11" fill="var(--muted)">${xl}</text></svg>`; }
function venn(a,ab,b,ne,A,Bn){ return `<svg viewBox="0 0 300 150" style="max-width:300px" role="img" aria-label="Diagram"><rect x="2" y="2" width="296" height="146" rx="8" fill="none" stroke="var(--ink)"/><circle cx="118" cy="78" r="56" fill="var(--wk-soft)" stroke="var(--wk)" stroke-width="2"/><circle cx="182" cy="78" r="56" fill="rgba(31,99,181,.08)" stroke="var(--c2)" stroke-width="2"/><text x="78" y="20" ${FT} font-weight="700" font-size="12" fill="var(--wk)">${A}</text><text x="198" y="20" ${FT} font-weight="700" font-size="12" fill="var(--c2)">${Bn}</text>${[[92,a],[150,ab],[208,b],[272,ne]].map(([x,v],i)=>`<text x="${x}" y="${i===3?136:84}" text-anchor="middle" ${FT} font-weight="800" font-size="16" fill="var(--ink)">${v}</text>`).join('')}</svg>`; }
const blank=(A,Bn)=>venn('?','?','?','?',A,Bn);
const fill=a=>`<div class="fillin">${a.map(x=>`<span>${x} = ______</span>`).join('')}</div>`;
const box=(f,lo,hi,st,xl,out)=>ST.boxSVG(f,lo,hi,st,{labels:true,out:out||[],xlabel:xl});

/* ---------- Board answers: written like the professor's board, numbers computed here so they always match ---------- */
const B=Board, XBb='<span class="xb">x</span>';
const num=x=>String(parseFloat((+x).toFixed(4))).replace('-','−');
const lcd=x=>String(parseFloat((+x).toPrecision(10))).replace('-','−');
const r2=x=>num(Math.round(x*100)/100), r1=x=>num(Math.round(x*10)/10);
const sum=a=>a.reduce((s,x)=>s+x,0);
const sq2='<sup>2</sup>';
/* mean of a list */
function gMean(xs,o={}){ const n=xs.length, S=sum(xs), m=S/n;
  return {t:o.t,lines:[B.line(`x<sub>i</sub> = ${xs.map(num).join(', ')}`),
    B.fr(XBb,'Σx<sub>i</sub>','n',{n:'list above',d:String(n)}),
    B.fr(XBb,xs.map(num).join(' + '),String(n),{plain:true}),
    B.line(`${XBb} = ${B.frac(num(S),String(n))} = <b>${num(m)}</b>${o.unit?' '+o.unit:''}`,'ans')],
    calc:[`(${xs.map(num).join('+')})÷${n}`,lcd(m)]}; }
/* names used in class: Var = s², SD = s, CV */
const NM=(h)=>B.line(`<span class="nm">${h}</span>`);
/* sample variance, bracket method: every (x − x̄)² in brackets, same entry on the calculator */
function gVar(xs,o={}){ const n=xs.length, m=sum(xs)/n, S=sum(xs.map(x=>(x-m)**2)), M=num(m);
  return {t:o.t,lines:[NM(`Var = s${sq2} (s${sq2} is the maths symbol, Var is what we use)`),
    B.fr('Var',`Σ(x − ${XBb})${sq2}`,'n − 1',{n:`${XBb} = ${M}`,d:`n = ${n}`}),
    B.line(`Var = [ ${xs.map(x=>`<span class="nw">(${num(x)} − ${M})${sq2}</span>`).join(' + ')} ] ÷ <span class="nw">(${n} − 1)</span>`),
    B.line(`Var = ${B.frac(num(S),String(n-1))} = <b>${num(S/(n-1))}</b>`,'ans')],
    calc:[`(${xs.map(x=>`(${num(x)}−${M})²`).join('+')})÷(${n}−1)`,lcd(S/(n-1))]}; }
/* standard deviation from a variance */
function gSD(v,o={}){ const s=Math.sqrt(v), inner=o.inner||'Var', exact=Number.isInteger(s);
  return {t:o.t,lines:(o.inner?[]:[NM('SD = s (s is the maths symbol, SD is what we use)')]).concat([B.line(`SD = √<span class="g">${inner}</span> <span class="g">&nbsp;⟶ ${num(v)}</span>`),B.line(`SD = √${num(v)} ${exact?'=':'≈'} <b>${exact?num(s):r2(s)}</b>`,'ans')]),calc:[`√(${num(v)})`,lcd(s)]}; }
/* coefficient of variation */
function gCV(s,m,o={}){ const cv=s/m*100, sTxt=o.sTxt||r2(s), L=o.lhs||'CV';
  return {t:o.t,lines:[B.fr(L,'SD',XBb,{n:sTxt,d:num(m),after:'× 100%'}),
    B.line(`${L} = ${B.frac(sTxt,num(m))} × 100% ${Number.isInteger(cv)?'=':'≈'} <b>${Number.isInteger(cv)?num(cv):r1(cv)}%</b>`,'ans')],
    calc:[`${o.entry||num(s)}÷${num(m)}×100`,lcd(cv)]}; }
/* discrete: E(X) */
function gE(xs,ps,o={}){ const e=sum(xs.map((x,i)=>x*ps[i]));
  return {t:o.t,lines:[B.line(`E(X) = Σ <span class="g">x</span> · <span class="r">P(x)</span>`),B.dec([['x',xs.join(', ')],['P(x)',ps.join(', ')]]),
    B.line(`E(X) = ${xs.map((x,i)=>`${x}(${ps[i]})`).join(' + ')}`),B.line(`E(X) = <b>${num(e)}</b>`,'ans')],
    calc:[xs.map((x,i)=>`${x}×${ps[i]}`).join('+'),lcd(e)]}; }
/* discrete: Var(X), bracket method */
function gVarX(xs,ps,o={}){ const mu=sum(xs.map((x,i)=>x*ps[i])), V=sum(xs.map((x,i)=>(x-mu)**2*ps[i])), M=num(mu);
  return {t:o.t,lines:[B.line(`Var(X) = Σ(<span class="g">x</span> − <span class="r">μ</span>)${sq2} · P(x)`),B.dec([['x',xs.join(', ')],['μ = E(X)',M],['P(x)',ps.join(', ')]]),
    B.line(`Var(X) = ${xs.map((x,i)=>`<span class="nw">(${x} − ${M})${sq2}(${ps[i]})</span>`).join(' + ')}`),
    B.line(`Var(X) = <b>${num(V)}</b>`,'ans')],
    calc:[xs.map((x,i)=>`(${x}−${M})²×${ps[i]}`).join('+'),lcd(V)]}; }
const board=(groups)=>B.make(groups,HOW);
const stepsNH=a=>`<div class="mg">${a.map(([l,t])=>`<div${l==='Answer'?' class="fin"':''}><span>${l}</span><span>${t}</span></div>`).join('')}</div>`;

/* LEFT and RIGHT signs under every graph: the ends of the x-axis */
const LR=`<div class="lr" aria-label="Left is small values, right is large values"><span class="l">← LEFT<small>small values</small></span><span class="r">RIGHT →<small>large values</small></span></div>`;
const G=svg=>`<div class="g">${svg}${LR}</div>`;
function skewPic(k){
  const P={right:'M14,120 C40,120 50,30 78,30 C112,30 128,100 226,116',
           sym:'M14,120 C70,120 80,30 120,30 C160,30 170,120 226,120',
           left:'M226,120 C200,120 190,30 162,30 C128,30 112,100 14,116'}[k];
  const T={right:'Right-skewed',sym:'Symmetric',left:'Left-skewed'}[k], S={right:'positive',sym:'no skew',left:'negative'}[k];
  const tail={right:`<path d="M140,76 L206,104" stroke="var(--c3)" stroke-width="2.4" marker-end="url(#ah-${k})"/><text x="176" y="72" text-anchor="middle" ${FT} font-weight="700" font-size="12" fill="var(--c3)">long tail</text>`,
              left:`<path d="M100,76 L34,104" stroke="var(--c2)" stroke-width="2.4" marker-end="url(#ah-${k})"/><text x="64" y="72" text-anchor="middle" ${FT} font-weight="700" font-size="12" fill="var(--c2)">long tail</text>`,
              sym:`<text x="120" y="20" text-anchor="middle" ${FT} font-size="11" fill="var(--muted)">two equal sides</text>`}[k];
  const ord={right:'mode &lt; median &lt; mean',sym:'mean ≈ median',left:'mean &lt; median &lt; mode'}[k];
  const col={right:'var(--c3)',sym:'var(--muted)',left:'var(--c2)'}[k];
  return `<figure class="sk"><figcaption><b>${T}</b><span>${S}</span></figcaption><svg viewBox="0 0 240 150" role="img" aria-label="${T} curve"><defs><marker id="ah-${k}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${col}"/></marker></defs>
    <path d="${P} L226,120 L14,120 Z" fill="var(--wk-soft)"/><path d="${P}" fill="none" stroke="var(--wk)" stroke-width="2.6"/>${tail}
    <line x1="10" x2="230" y1="120" y2="120" stroke="var(--ink)" stroke-width="1.4"/>
    <text x="12" y="140" ${FT} font-weight="800" font-size="12" fill="var(--c2)">← LEFT</text><text x="228" y="140" text-anchor="end" ${FT} font-weight="800" font-size="12" fill="var(--c3)">RIGHT →</text></svg>
    <p class="ord">${ord}</p></figure>`;
}
const SKEW=`<div class="skew"><div class="sk-pics">${skewPic('right')}${skewPic('sym')}${skewPic('left')}</div>
  <div class="sk-rule"><p class="say"><b>Follow the long tail.</b> The tail is the side where the graph goes down <b>slowly</b> and stretches out far. The tail gives the name.</p>
  <ol><li>Find the peak: the highest bar or point.</li><li>Find the side where the graph goes down slowly into a long tail.</li><li>Tail on the <b class="rt">RIGHT</b> → <b>right-skewed</b> (positive). Tail on the <b class="lt">LEFT</b> → <b>left-skewed</b> (negative). No tail, both sides the same → <b>symmetric</b>.</li></ol>
  <p><b>Check with the numbers.</b> The mean is pulled toward the tail. Right-skewed: mean &gt; median. Left-skewed: mean &lt; median. Symmetric: mean ≈ median.</p>
  <p class="careful"><b>Careful.</b> “It drops toward the right” is right-skewed only when the graph goes down <b>slowly</b> and keeps going on the right. If the graph climbs slowly from the left and then drops <b>suddenly</b> on the right, the long tail is on the left: that is <b>left-skewed</b>.</p>
  <p><b>Which side is which?</b> Use the x-axis, not your hands: <b class="lt">LEFT</b> = small values, <b class="rt">RIGHT</b> = large values. Every graph on this page shows the two signs.</p></div></div>`;

/* ---------------- Part 1 · Graphs and skewness ---------------- */
const P1S=[
 {revise:'Skew: follow the long tail. The bars go down slowly to the RIGHT (large values) → right-skewed, and the mean is pulled toward the tail: mean &gt; median. Usual mistake: naming the skew after the peak, not the tail.',see:{t:'Revise: Week 2 · Histograms and shape',href:'week-02.html#histogram'},check:[{l:'Shape',opts:['Right-skewed','Left-skewed','Symmetric'],v:'Right-skewed'},{l:'Bigger',opts:['Mean','Median'],v:'Mean'}],type:'Histogram',q:`Hours on social media per week (50 students):${G(ST.hist([18,14,9,6,3],['0','5','10','15','20','25'],{ymax:20,xlabel:'Hours per week'}))}What is the shape? Which is bigger, the mean or the median?`,
  hint:steps([['Peak','Highest bar: 0–5 hours, on the <b>left</b>.'],['Tail','The bars go down slowly toward the <b>right</b> (18, 14, 9, 6, 3): a long tail on the right.'],['Answer','<b>Right-skewed</b> (positive). The mean is pulled toward the tail: <b>mean &gt; median</b>.']])},
 {revise:'Follow the long tail, not the peak. The line climbs slowly from the LEFT (small values) and drops suddenly on the right → left-skewed, so mean &lt; median. Usual mistake: calling it right-skewed because it drops on the right.',see:{t:'Revise: Week 2 · Histograms and shape',href:'week-02.html#histogram'},check:[{l:'Shape',opts:['Right-skewed','Left-skewed','Symmetric'],v:'Left-skewed'},{l:'Bigger',opts:['Mean','Median'],v:'Median'}],type:'Polygon',q:`Exam scores (21 students):${G(ST.hist([1,2,4,8,6],['50','60','70','80','90','100'],{pad:true,poly:true,hideBars:true,ymax:9,xlabel:'Score'}))}What is the shape? Which is bigger, the mean or the median?`,
  hint:steps([['Peak','Highest point: 80–90, on the <b>right</b>.'],['Tail','From the peak the line drops <b>suddenly</b> on the right. On the left it climbs <b>slowly</b> (1, 2, 4, 8): the long tail is on the <b>left</b>.'],['Answer','<b>Left-skewed</b> (negative): <b>mean &lt; median</b>.']])},
 {revise:'No long tail and both sides the same → symmetric, mean ≈ median. Usual mistake: looking for a skew when the frequencies mirror each other (2, 5 | 8 | 5, 2).',see:{t:'Revise: Week 2 · Histograms and shape',href:'week-02.html#histogram'},check:[{l:'Shape',opts:['Right-skewed','Left-skewed','Symmetric'],v:'Symmetric'}],type:'Histogram',q:`Heights of 22 students (cm):${G(ST.hist([2,5,8,5,2],['150','155','160','165','170','175'],{ymax:9,xlabel:'Height (cm)'}))}What is the shape?`,
  hint:steps([['Peak','Highest bar: 160–165, in the <b>middle</b>.'],['Tail','Both sides go down the same way: 2, 5 | 8 | 5, 2. No long tail.'],['Answer','<b>Symmetric</b>: mean ≈ median.']])},
 {revise:'The mean is pulled toward the long tail. Mean &lt; median → tail on the LEFT (small values) → left-skewed. Usual mistake: reversing the rule.',see:{t:'Revise: Week 2 · Histograms and shape',href:'week-02.html#histogram'},check:[{l:'Shape',opts:['Right-skewed','Left-skewed','Symmetric'],v:'Left-skewed'}],type:'Numbers',q:'A class has mean score 72 and median score 78. Is the distribution symmetric, right-skewed or left-skewed?',
  hint:steps([['Compare','Mean 72 &lt; median 78.'],['Why','A few very low scores pull the mean down, toward the <b>left</b>.'],['Answer','<b>Left-skewed</b> (negative).']])},
 {revise:'LEFT = small values, RIGHT = large values. A few very large values → tail on the right (right-skewed); a few very small values → tail on the left (left-skewed). Usual mistake: following where most of the data is, not the few extreme values.',see:{t:'Revise: Week 2 · Histograms and shape',href:'week-02.html#histogram'},check:[{l:'(a) Salaries',opts:['Right-skewed','Left-skewed','Symmetric'],v:'Right-skewed'},{l:'(b) Easy quiz',opts:['Right-skewed','Left-skewed','Symmetric'],v:'Left-skewed'}],type:'Words',q:'Without a graph, which way is each skewed? (a) Monthly salaries in a large company: most staff earn a normal salary and a few managers earn a lot. (b) An easy quiz: most students score high and a few score very low.',
  hint:steps([['(a)','The few very high salaries make a long tail of <b>large values</b>: on the <b>right</b> → <b>right-skewed</b>.'],['(b)','The few very low scores make a long tail of <b>small values</b>: on the <b>left</b> → <b>left-skewed</b>.'],['Answer','(a) <b>right-skewed</b> · (b) <b>left-skewed</b>. Small values are always on the left, large values on the right.']])}];
const P1B=[
 {revise:'Read the five numbers: min, Q1, median, Q3, max. Range = max − min, IQR = Q3 − Q1; each part of the boxplot holds 25% of the data. Usual mistake: counting the values above Q3 as 50%.',see:{t:'Revise: Week 4 · Range, IQR and the boxplot',href:'week-04.html#range-iqr'},check:[{l:'Median',v:11},{l:'Range',v:14},{l:'IQR',v:5},{l:'Phones over 14 h',v:30}],type:'Read a boxplot',q:`Battery life of 120 phones (hours):${G(box([6,9,11,14,20],4,22,2,'Hours'))}Find min, max, range, Q1, median, Q3, IQR. How many phones last more than 14 hours?`,
  hint:steps([['Read','Min <b>6</b> · Q1 <b>9</b> · Median <b>11</b> · Q3 <b>14</b> · Max <b>20</b>'],['Calculate','Range = 20 − 6 = <b>14</b>. IQR = 14 − 9 = <b>5</b>.'],['Answer','Above Q3 = 25% → 0.25 × 120 = <b>30 phones</b>.']])},
 {revise:'n = sum of the frequencies. The median is at position (n + 1) ÷ 2: find it with the cumulative frequencies. Usual mistake: taking the tallest bar as the median class (that is the modal class).',see:{t:'Revise: Week 2 · Histograms and shape',href:'week-02.html#histogram'},check:[{l:'Students (n)',v:25},{l:'Modal class',opts:['50–59','60–69','70–79','80–89','90–99'],v:'70–79'},{l:'Median class',opts:['50–59','60–69','70–79','80–89','90–99'],v:'70–79'},{l:'80 or more',v:36,u:'%',pct:true}],type:'Read a histogram',q:`Exam scores of a class:${G(ST.hist([2,5,9,6,3],['49.5','59.5','69.5','79.5','89.5','99.5'],{ymax:10,xlabel:'Score'}))}How many students? Modal class? In which class is the median? What % scored 80 or more?`,
  hint:steps([['Read','f = 2, 5, 9, 6, 3 → n = <b>25</b>.'],['Modal class','Tallest bar: <b>70–79</b>.'],['Median','Position (25 + 1) ÷ 2 = 13th. Cumulative: 2, 7, 16 → the 13th is in <b>70–79</b>.'],['Answer','80 or more: 6 + 3 = 9 → 9 ÷ 25 = <b>36%</b>.']])},
 {revise:'Each bar is the count of one value: use the cumulative counts (3, 10, 16, 19, 20) to place the median and the quartiles. Mean = Σ(x × f) ÷ n. Usual mistake: using the bar heights as the data values.',see:{t:'Revise: Week 3 · Median and mode',href:'week-03.html#median'},check:[{l:'Mode',v:1},{l:'Median',v:1.5},{l:'IQR',v:1},{l:'Range',v:4},{l:'Mean',v:1.6}],type:'Read a bar chart',q:`Number of siblings of 20 students:${G(bars([3,7,6,3,1],['0','1','2','3','4'],'Siblings'))}Find the mode, median, Q1, Q3, IQR, range and mean.`,

 <tr><td>—</td><td>Simple</td><td>P(E) = favourable ÷ total</td></tr>
 <tr><td><b>NOT</b></td><td>Complement</td><td>P(not A) = 1 − P(A)</td></tr>
 <tr><td><b>OR</b></td><td>Addition</td><td>No overlap (mutually exclusive): P(A) + P(B)<br>Overlap (BOTH given): P(A) + P(B) − P(A and B)</td></tr>
 <tr><td><b>AND</b></td><td>Multiplication</td><td>Independent: P(A) × P(B). Fair choice of 2 → each is 1/2</td></tr></table>`;

  hint:stepsNH([['(a)','<b>Discrete</b>: we count late deliveries (0, 1, 2, 3).'],['(b)','ΣP(x) = 1 → k = 1 − (0.2 + 0.3 + 0.1) = <b>0.4</b>.'],['(c)','P(X ≥ 2) = 0.4 + 0.1 = <b>0.5</b>. At least one = NOT zero = 1 − 0.2 = <b>0.8</b>.'],['(d)','OR, no overlap: 0.2 + 0.1 = <b>0.3</b>.']])
