<style>
:root{--wk:#6B4FB8;--wk-soft:rgba(107,79,184,.10);--wk-d:#B9A3F5;--wk-soft-d:rgba(185,163,245,.14)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.two button{border:2px solid var(--wk);background:var(--wk-soft);color:var(--ink);border-radius:14px;padding:20px;text-align:left;cursor:pointer;font-family:var(--f-display)}.two button b{display:block;font-size:1.25rem;margin:6px 0 4px}.two button span{font-size:2rem}@media (max-width:560px){.two{grid-template-columns:minmax(0,1fr)}}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.chips button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;font-family:var(--f-display);font-size:.86rem}.chips button[aria-pressed="true"]{background:var(--wk);color:var(--on-wk);border-color:var(--wk)}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}.card{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--bg);display:grid;gap:6px;font-family:var(--f-display);font-size:.9rem;align-content:start}.card h4{margin:0;font-size:1rem}.card .k{font-family:var(--f-mono);font-size:.7rem;color:var(--wk);letter-spacing:.06em;text-transform:uppercase}.card .picked{color:var(--good);font-weight:700}.prompt{font-family:var(--f-display);font-size:1.35rem;font-weight:700;line-height:1.3;padding:18px;border-radius:12px;background:var(--wk-soft);border:2px solid var(--wk)}.dl{display:grid;gap:8px}.dl a{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);text-decoration:none;color:var(--ink);font-family:var(--f-display);font-size:.9rem}.dl a b{color:var(--wk)}.dl a small{display:block;color:var(--muted)}.out{white-space:pre-wrap;font-family:var(--f-display);font-size:.9rem;background:var(--sunk);border-radius:10px;padding:12px}.sdgres{display:grid;gap:6px}.sdgres a{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);text-decoration:none;color:var(--ink);font-family:var(--f-display)}.sdgres a b{font-size:1.3rem;color:var(--wk);min-width:28px}
:root{}
</style>
<script src="assets/easy.js"></script></head>
<body>
<script src="assets/site.js"></script>
<script src="assets/supports.js"></script>
<script src="assets/course.js"></script>
<script src="assets/onepage.js"></script>
<script src="assets/ent141.js"></script>
<script src="assets/poster.js"></script>
<script src="assets/kb.js"></script>
<script src="assets/search-index.js"></script>
<script src="assets/assistant.js"></script>
<script>
const {W} = Lecture; const {store,esc} = ENT141;
const go=i=>document.querySelectorAll('.toc ol li button')[i].click();
function pickProblem(p){ const S=Poster.load(); S.sdg=p.sdg; S.problem=p.t+'. Who has it: '+p.user+'.'; Poster.save(S); }

/* problem bank: real problem areas; students verify with the source before using */
const BANK=[
 {need:'Education',t:'First-year students struggle with the jump from school to university study',user:'First-year university students',sdg:'SDG 4, target 4.4',ask:'What was hardest in your first month? What did you do about it?',data:'UNESCO UIS (uis.unesco.org)'},
 {need:'Education',t:'Students of determination face barriers to learning on campus',user:'Students of determination and their teachers',sdg:'SDG 4, target 4.5',ask:'Walk me through a normal day on campus. Where does it get hard?',data:'UNESCO UIS · UAE SDG data (bayanat.ae)'},
 {need:'Education',t:'Young people manage money badly when they first earn or receive an allowance',user:'Students aged 17–22',sdg:'SDG 4, target 4.4',ask:'Tell me about the last time you ran out of money before the month ended.',data:'World Bank Global Findex (data.worldbank.org)'},
 {need:'Health',t:'Young people sit most of the day and rarely exercise',user:'University students',sdg:'SDG 3, target 3.4',ask:'Describe yesterday from waking up to sleeping. When did you move?',data:'WHO Global Health Observatory (who.int/data/gho)'},
 {need:'Health',t:'Young drivers are involved in serious road crashes',user:'Drivers aged 18–25 and their families',sdg:'SDG 3, target 3.6',ask:'Tell me about the last time you felt unsafe on the road.',data:'WHO road safety data · Dubai Pulse (dubaipulse.gov.ae)'},
 {need:'Health',t:'Outdoor workers suffer from summer heat',user:'Delivery riders and outdoor workers',sdg:'SDG 8, target 8.8',ask:'What do you do between jobs on a hot afternoon?',data:'ILOSTAT (ilostat.ilo.org) · UAE Ministry of Human Resources and Emiratisation'},
 {need:'Social protection',t:'Good food is thrown away while some families need it',user:'Households, restaurants and families in need',sdg:'SDG 12, target 12.3',ask:'What did your household throw away last week, and why?',data:'UNEP Food Waste Index · UAE Food Bank'},
 {need:'Social protection',t:'Elderly people living alone feel isolated',user:'Older residents and their families',sdg:'SDG 10, target 10.2',ask:'Who did you speak to yesterday? How often do you go out?',data:'World Bank population data · UAE SDG data (bayanat.ae)'},
 {need:'Social protection',t:'Low-income workers cannot easily use banking and digital payments',user:'Low-income workers',sdg:'SDG 8, target 8.10',ask:'How did you send or receive money last month?',data:'World Bank Global Findex (data.worldbank.org)'},
 {need:'Job opportunities',t:'Graduates struggle to get a first job without experience',user:'Final-year students and new graduates',sdg:'SDG 8, target 8.6',ask:'Tell me about the last job you applied for. What happened?',data:'ILOSTAT youth indicators (ilostat.ilo.org)'},
 {need:'Job opportunities',t:'Women find it hard to return to work after a career break',user:'Mothers returning to work',sdg:'SDG 5, target 5.5',ask:'What happened when you started looking for work again?',data:'ILOSTAT · World Bank Gender Data Portal'},
 {need:'Job opportunities',t:'Home-based small businesses struggle to find customers online',user:'Home-based sellers (food, crafts, tutoring)',sdg:'SDG 8, target 8.3',ask:'How did your last customer find you?',data:'World Bank Enterprise data · UAE SDG data (bayanat.ae)'}];

function bank(el){
  let f='All';
  const draw=()=>{ const cur=Poster.load();
    el.innerHTML=`<div class="chips">${['All','Education','Health','Social protection','Job opportunities'].map(n=>`<button type="button" aria-pressed="${f===n}" data-f="${n}">${n}</button>`).join('')}</div><div class="cards">${BANK.map((p,i)=>[p,i]).filter(([p])=>f==='All'||p.need===f).map(([p,i])=>`<div class="card"><span class="k">${p.need} · ${p.sdg}</span><h4>${p.t}</h4><div><b>Interview:</b> ${p.user}</div><div><b>First question:</b> “${p.ask}”</div><div><b>Check the facts:</b> ${p.data}</div>${String(cur.problem).startsWith(p.t)?'<span class="picked">✓ Added to your poster · <a href="poster.html#z1">open it</a></span>':`<button type="button" class="btn" data-i="${i}">Pick this problem</button>`}</div>`).join('')}</div>`;
    el.querySelectorAll('[data-f]').forEach(b=>b.addEventListener('click',()=>{ f=b.dataset.f; draw(); }));
    el.querySelectorAll('[data-i]').forEach(b=>b.addEventListener('click',()=>{ pickProblem(BANK[+b.dataset.i]); draw(); })); };
  draw();
}

/* idea finder: random prompts from place × person × moment */
const PLACE=['on campus','at home','on the bus or metro','in a mall','at a clinic or hospital','at work','online','at the mosque or a community centre','in the car park','at the supermarket'];
const PERSON=['a first-year student','a working mother','a delivery rider','a grandparent','a person of determination','a small shop owner','a new resident in the UAE','a teenager','a cleaner or security guard','a nurse'];
const MOMENT=['in the morning rush','during exam week','in the summer heat','during Ramadan','on their first day','at the end of the month','late at night','when it rains','when they are sick','when they are alone'];
function finder(el){
  const r=a=>a[Math.floor(Math.random()*a.length)];
  const key='ent141-bugs'; const bugs=store.get(key)||'';
  el.innerHTML=`<div class="prompt" id="pr"></div><div class="row" style="margin:10px 0 16px"><button type="button" class="btn" id="sh">New prompt</button><span class="mono" style="color:var(--muted)">Imagine it, then go and watch it for real.</span></div>
   <div class="ins"><label for="bug">Your bug list: 10 things that annoyed you or someone you know this week. One per line.</label><textarea id="bug" rows="7" placeholder="The printer in the library never works&#10;My grandmother cannot read the medicine labels">${esc(bugs)}</textarea><div class="feedback" id="bo"></div></div>`;
  const sh=()=>{ el.querySelector('#pr').textContent=`What frustrates ${r(PERSON)} ${r(PLACE)} ${r(MOMENT)}?`; };
  const t=el.querySelector('#bug'), o=el.querySelector('#bo');
  const up=()=>{ store.set(key,t.value); const n=t.value.split('\n').filter(x=>x.trim()).length; o.innerHTML=n<10?`<b>${n} / 10.</b> Small, everyday annoyances are fine: big problems hide inside them.`:`<b>${n} bugs.</b> Circle the one that affects <b>many people</b>, happens <b>often</b>, and that you can <b>talk to</b> those people about. Then check it in the SDG check.`; };
  el.querySelector('#sh').addEventListener('click',sh); t.addEventListener('input',up); sh(); up();
}

/* SDG check: keyword match, then the student confirms on sdgs.un.org */
const SDGK=[[1,'poverty poor low-income income allowance social protection homeless debt'],[2,'hunger food meal nutrition farm farming agriculture'],[3,'health sick disease mental stress exercise obesity diabetes clinic hospital road crash accident medicine sleep smoking'],[4,'education school university student learning study teacher course skill literacy exam tutor'],[5,'women woman girl gender mother female equality'],[6,'water sanitation toilet hygiene clean water'],[7,'energy electricity solar power renewable'],[8,'job work employment unemployed career graduate salary worker business startup income heat'],[9,'innovation technology infrastructure internet industry digital'],[10,'inequality inclusion disability determination elderly old migrant isolated lonely access'],[11,'city transport bus metro traffic housing parking urban public space'],[12,'waste plastic recycling food waste consumption packaging fashion e-waste'],[13,'climate carbon emissions heat temperature weather'],[14,'ocean sea marine fish beach coral'],[15,'land desert tree forest animal wildlife biodiversity'],[16,'justice peace safety crime bullying corruption institution'],[17,'partnership cooperation government collaboration']];
function sdgCheck(el){
  el.innerHTML=`<div class="ins"><label for="sq">Describe your problem in one sentence</label><input type="text" id="sq" placeholder="Students waste food in the cafeteria"></div><div class="sdgres" id="sr" style="margin-top:10px"></div>`;
  const q=el.querySelector('#sq'), r=el.querySelector('#sr');
  const up=()=>{ const w=q.value.toLowerCase(); if(w.trim().length<6){ r.innerHTML='<p class="mono" style="color:var(--muted)">Type at least a few words.</p>'; return; }
    const hits=SDGK.map(([n,k])=>[n,k.split(' ').filter(x=>w.includes(x)).length]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]).slice(0,3);
    r.innerHTML=hits.length?`<p class="feedback" style="margin:0">Possible goals. Open each and find the <b>target</b> that matches your problem: only then is the link real.</p>`+hits.map(([n])=>`<a href="https://sdgs.un.org/goals/goal${n}" target="_blank" rel="noopener"><b>${n}</b><span>${ENT141.SDGS[n-1]} <small style="color:var(--muted)">· read the targets ↗</small></span></a>`).join(''):`<p class="feedback">No clear match. Add who suffers and what goes wrong (health, waste, jobs, learning…), or browse <a href="https://sdgs.un.org/goals" target="_blank" rel="noopener">all 17 goals</a>.</p>`; };
  q.addEventListener('input',up); up();
}

/* open data finder */
const DATA={
  'UAE':[['Bayanat','bayanat.ae','The official UAE open data portal: population, education, health, economy.'],['UAE SDG Data Hub','u.ae/en/about-the-uae/digital-uae/data/sdg-data-hubs','UAE progress on each SDG indicator.'],['Dubai Pulse','dubaipulse.gov.ae','Dubai open data: transport, tourism, population, services.']],
  'World':[['UN SDG Global Database','unstats.un.org/sdgs/dataportal','Official data for every SDG indicator, by country.'],['World Bank Open Data','data.worldbank.org','Economy, education, gender, finance, by country and year.'],['Our World in Data','ourworldindata.org','Charts with sources on health, energy, food, education.']],
  'By topic':[['WHO Global Health Observatory','who.int/data/gho','Health: disease, road safety, physical activity.'],['UNESCO Institute for Statistics','uis.unesco.org','Education: enrolment, literacy, completion.'],['ILOSTAT','ilostat.ilo.org','Jobs: youth unemployment, women at work, wages.']]};
function dataFinder(el){
  el.innerHTML=`<div class="dl">${Object.entries(DATA).map(([g,L])=>`<span class="eyebrow">${g}</span>${L.map(([n,u,d])=>`<a href="https://${u}" target="_blank" rel="noopener"><b>${n}</b> · ${u} ↗<small>${d}</small></a>`).join('')}`).join('')}</div>
   <div class="box exam" style="margin-top:12px"><b class="lbl">Use a number in three steps</b>1. Write the number, the year and the country. 2. Copy the source name and link. 3. Cite it: <i>World Bank. (2024). Indicator name [Data set]. data.worldbank.org</i></div>`;
}

/* interview and survey designer */
function designer(el){
  const key='ent141-designer'; let s={}; try{s=JSON.parse(store.get(key)||'{}')}catch(e){}
  el.innerHTML=`<div class="ins"><label for="du">Who will you talk to?</label><input type="text" id="du" value="${esc(s.u||'')}" placeholder="first-year students who commute by bus"><label for="dt">What is the problem area?</label><input type="text" id="dt" value="${esc(s.t||'')}" placeholder="getting to 8 am classes on time"></div>
   <div class="chips" style="margin-top:10px"><button type="button" aria-pressed="true" data-m="i">Interview guide</button><button type="button" aria-pressed="false" data-m="s">Short survey</button></div><div class="out" id="do"></div><div class="row" style="margin-top:8px"><button type="button" class="btn ghost" id="dc">Copy</button><a class="btn ghost" href="https://forms.office.com" target="_blank" rel="noopener">Open Microsoft Forms ↗</a></div>`;
  let m='i';
  const up=()=>{ s.u=el.querySelector('#du').value; s.t=el.querySelector('#dt').value; store.set(key,JSON.stringify(s)); const u=s.u||'[who]', t=s.t||'[problem area]';
    el.querySelector('#do').textContent=m==='i'?`Interview guide · ${u} · about ${t}\n\n1. Introduce yourself: “We are students learning about ${t}. There are no right answers.”\n2. Tell me about the last time you dealt with ${t}.\n3. What was the hardest part? Why?\n4. What did you do about it? Why that way?\n5. How did you feel at that moment?\n6. What have you tried that did not work?\n7. If you had a magic wand, what would change?\n8. Who else should we talk to?\n\nAfter each answer, ask “Why?” once more. Write exact quotes.`
     :`Short survey · ${u} · about ${t}\n(Use only after interviews, to see how common the problem is.)\n\n1. How often do you face ${t}?  Never · Monthly · Weekly · Daily\n2. How big a problem is it for you?  1 (small) to 5 (huge)\n3. What do you do about it today?  (short answer)\n4. How much time or money does it cost you each week?  (short answer)\n5. Age group and role  (choices)\n\nKeep it under 2 minutes. Aim for 30+ answers.`; };
  el.querySelectorAll('[data-m]').forEach(b=>b.addEventListener('click',()=>{ m=b.dataset.m; el.querySelectorAll('[data-m]').forEach(x=>x.setAttribute('aria-pressed',x===b)); up(); }));
  el.querySelectorAll('input').forEach(i=>i.addEventListener('input',up));
  el.querySelector('#dc').addEventListener('click',e=>{ try{navigator.clipboard.writeText(el.querySelector('#do').textContent).then(()=>e.target.textContent='Copied')}catch(x){} });
  up();
}

/* prototype helper */
const PROTO={'What is your idea?':[
  ['An app or website','Draw 3 to 5 screens on paper, or build clickable slides in PowerPoint or Canva. Ask a user to “tap” through them.'],
  ['A service','Draw a storyboard: 6 frames from the user’s problem to the moment it is solved. Or act it out as a role-play.'],
  ['A physical product','Make a rough model from cardboard, paper or clay, or a quick 3D model in Tinkercad (free, in the browser).'],
  ['An event or campaign','Design the poster or social post in Canva and show it to 5 people: would they come or share it?'],
  ['A new process or rule','Draw the steps as a flowchart, before and after your change, and walk a user through both.']]};
const PITCH=[['Hook',8,'A surprising fact or a question.'],['Problem',12,'Who suffers, with one quote from your interviews.'],['Solution',15,'What you propose, in one sentence.'],['Proof',10,'What users said when they saw your prototype.'],['Ask',5,'What you want from the audience.']];
function pitchBuilder(el){
  const key='ent141-pitch'; let s={}; try{s=JSON.parse(store.get(key)||'{}')}catch(e){}
  el.innerHTML=`<div class="ins">${PITCH.map(([l,sec,h],i)=>`<label for="pp${i}">${l} · ${sec} s <small style="color:var(--muted);font-weight:400">${h}</small></label><textarea id="pp${i}" rows="2">${esc(s[i]||'')}</textarea>`).join('')}<div class="feedback" id="pw"></div></div><div style="margin-top:14px" id="tmr"></div>`;
  const up=()=>{ PITCH.forEach((_,i)=>s[i]=el.querySelector('#pp'+i).value); store.set(key,JSON.stringify(s)); const w=Object.values(s).join(' ').split(/\s+/).filter(Boolean).length; const sec=Math.round(w/2.3);
    el.querySelector('#pw').innerHTML=`<b>${w} words ≈ ${sec} seconds</b> at a calm pace. ${sec>50?'Too long: cut words until you reach about 45 seconds.':sec<25?'Add a little: aim for 30–45 seconds.':'Good length.'}`; };
  el.querySelectorAll('textarea').forEach(t=>t.addEventListener('input',up)); up(); ENT141.timer(el.querySelector('#tmr'),PITCH);
}

Lecture.mount({
  id:'ent141-tool', week:'T', course:'ENT 141', short:'Toolkit', eyebrow:'Toolkit · use it any time', endLabel:'End',
  title:'Toolkit', meta:'Step-by-step help for your projects',
  scenes:[
  { nav:'Start here', title:'No idea yet? Choose your path', kind:'activity', full:true,
    narration:[`Two ways to start. Both end with a real problem, linked to an SDG target, that you can test with real people.`],
    fig:{label:'Choose', build:el=>{ el.innerHTML=`<div class="two"><button type="button" data-g="1"><b>Pick an existing problem</b>Twelve real problem areas with who to interview and where to check the facts.</button><button type="button" data-g="2"><b>Find your own problem</b>A prompt generator and a bug list to spot problems around you.</button></div>`; el.querySelectorAll('[data-g]').forEach(b=>b.addEventListener('click',()=>go(+b.dataset.g))); }} },
  { nav:'Problem bank', title:'Pick an existing problem', kind:'activity', full:true,
    narration:[`Pick one, then check the facts with the source before you use it. “Pick this problem” adds it to part 1 of <a href="poster.html#z1">your poster</a>.`],
    fig:{label:'Problem bank · filter by social need', build:bank} },
  { nav:'Find your own', title:'Find your own problem', kind:'activity', full:true,
    narration:[`Good problems hide in everyday annoyances. Shuffle prompts, then write your bug list.`],
    fig:{label:'Idea finder · saves in your browser', build:finder} },
  { nav:'SDG check', title:'Does my problem fit an SDG?', kind:'activity', full:true,
    narration:[`Type your problem. The check suggests goals; you confirm by finding the matching <b>target</b> on the UN site.`],
    fig:{label:'SDG check', build:sdgCheck} },
  { nav:'Find data', title:'Find open data', kind:'activity', full:true,
    narration:[`One reliable number makes your problem real. Use official sources, not blogs or AI answers.`],
    fig:{label:'Trusted open data', build:dataFinder} },
  { nav:'Interview or survey', title:'Design your interview or survey', kind:'activity', full:true,
    narration:[`Interview first to understand; survey later to count. Type your user and topic, then copy the guide.`],
    fig:{label:'Question designer', build:designer} },
  { nav:'Prototype', title:'Make a quick prototype', kind:'activity', full:true,
    narration:[`A prototype is the fastest, cheapest thing a user can see or try. Pick your idea type.`],
    video:{id:'H0_yKBitO8M',title:'Build a tower, build a team',by:'TED · Tom Wujec',why:'Why teams that build early and often do better.'},
    fig:{label:'Which prototype?', build:el=>W.picker(el,PROTO,'Select your idea type.')} },
  { nav:'Pitch', title:'Prepare and practise your pitch', kind:'activity', full:true,
    narration:[`Write five short parts, check the length, then practise with the timer. For feedback on pace and filler words, use <b>Rehearse with Coach</b> in PowerPoint (free with Microsoft 365).`],
    video:{id:'eIho2S0ZahI',title:'How to speak so that people want to listen',by:'TED · Julian Treasure',why:'Voice, pace and the habits that make people stop listening.'},
    src:`Microsoft Support. <a href="https://support.microsoft.com/en-us/office/rehearse-your-slide-show-with-presenter-coach-cd7fc941-5c3b-498c-a225-83ef3f64f07b" target="_blank" rel="noopener">Rehearse your slide show with Speaker Coach</a>.`,
    fig:{label:'Pitch builder and timer · saves in your browser', build:pitchBuilder} },
  ]
});
</script>
