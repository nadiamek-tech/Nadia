<script>
const {W} = Lecture; const {store,esc} = ENT141;
Lecture.mount({
  id:'ent141-w1', week:1, clo:'1', course:'ENT 141', short:'Week 1 · Introduction to Entrepreneurship',
  title:'Overview of the Course · Introduction to Entrepreneurship', meta:'OpenStax Ch. 1 · The Entrepreneurial Perspective · guest founder · 1-hour lecture + 2-hour lab',
  scenes:[
  { nav:'Start here', title:'Why do some people turn problems into ventures?', minutes:5,
    narration:[`This course takes your team from a real social problem to an idea you can defend. <span class="mono">Topics: Course Material · Course Assignments · Groups formation · What is Entrepreneurship? · Role of Entrepreneurs in the Society. CLO 1.</span>`],
    src:`Reading: Byers, T., Dorf, R. C., &amp; Nelson, A. J. (2019). <em>Technology ventures: From idea to enterprise</em> (5th ed.), Ch. 1. McGraw-Hill Education.`,
    fig:{label:`Today's class · lecture and lab`, build:el=>W.agenda(el,[[`Start here`,5,'l'],[`Course material`,10,'l'],[`Course assignments`,15,'l'],[`What is entrepreneurship?`,20,'l'],[`Role in society`,20,'l'],[`Groups formation`,35,'a'],[`Think about it`,15,'a']])} },

  { nav:'What is entrepreneurship?', title:'What is entrepreneurship?', minutes:20,
    narration:[`An <b>entrepreneur</b> spots a problem worth solving and builds a venture to solve it, accepting risk to create value (Byers et al., 2019, Ch. 1).`],
    src:`Byers et al. (2019), Ch. 1.`,
    fig:{label:`From problem to value · click or play`, flow:[
      {t:'Problem',s:'someone struggles',d:'A real, frequent pain for a group of people.'},
      {t:'Opportunity',s:'worth solving',d:'Enough people have it, and the timing is right.'},
      {t:'Venture',s:'a team acts',d:'People, money and time committed, with risk.'},
      {t:'Value',s:'for whom?',d:'Customers, the team and society all gain something.'}]} },

  { nav:'Role in society', title:'Role of entrepreneurs in the society', minutes:20,
    narration:[`Entrepreneurs create jobs, new services and growth. Careem started in Dubai in July 2012; when Uber completed its $3.1 billion acquisition in January 2020, Careem reported more than one million employment opportunities created in the region.`],
    src:`Uber Technologies (2020, January 2). Uber completes acquisition of Careem [Press release]. investor.uber.com`,
    fig:{label:`Careem in numbers · 2020`, html:`<div class="tiles"><div><div class="n">2012</div><div class="t">Founded in Dubai</div></div><div><div class="n">1M+</div><div class="t">Employment opportunities created in the region</div></div><div><div class="n">120</div><div class="t">Cities in 15 countries</div></div><div><div class="n">$3.1bn</div><div class="t">Acquired by Uber</div></div></div>`} },

  { nav:'Groups formation', title:'Activity · Form your team', kind:'activity', minutes:35,
    narration:[`Form a team, agree how you work, and choose one social need for your project: education, health, social protection or job opportunities. No idea yet? Open the <a href="toolkit.html">Toolkit</a>.`],
    fig:{label:`Team charter · saves in your browser`, build:el=>W.worksheet(el,{id:'ent141-w1-team',title:'ENT 141 · Team charter',fields:[
      {l:'Team name',rows:1},{l:'Members and one strength each',rows:3},{l:'Social need we will work on',ph:'education · health · social protection · job opportunities',rows:1},{l:'Who has this problem? (a group you can talk to)',rows:2},{l:'When and where we meet each week',rows:1},{l:'Our rule if someone misses a deadline',rows:2}]})} },

  { nav:'Think about it', title:'Think about it', kind:'activity', minutes:15,
    narration:[`Discuss with your team, then reveal one view. There is no single right answer.`],
    fig:{label:`Critical thinking · Careem`, build:el=>W.practice(el,[{q:'Careem reported more than one million employment opportunities. Is every job created by a platform a good job? What would you check?',hint:'Pay, hours, safety and security: a job count alone does not show quality.'},
{q:'When a startup like Careem grows, who gains and who might lose?',hint:"Riders and drivers may gain; taxi companies may lose customers. Every venture changes someone else's market."},
{q:'Name a business near you that solves a problem. What risk did its founder take?',hint:'Money, time, reputation, a stable job: entrepreneurship always involves a bet.'}],{label:'One view',prefix:''})} },
  ]
});
</script>
